name: CI

# Typecheck, lint and test on the runner directly.
#
# `pnpm install` runs here and on the developer's Mac, and only the runner is safe (plan 005):
# it is a disposable VM with no human identity on it, so a lifecycle script from an
# agent-authored lockfile diff gets nothing worth having. The Mac is the opposite, which is why
# the README makes every host toolchain command a review gate.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # corepack, not a pnpm setup action, so the version comes from package.json's
      # `packageManager` field and cannot drift from what `mise.toml` pins. It has to run
      # after setup-node, because the shims land in whichever Node install is on PATH.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test
