# agentdeck's tmux configuration. Passed as `tmux -f` so the operator's ~/.tmux.conf is never
# read on this socket (plan 001).
#
# This file is READ BY TMUX RUNNING AS THE OPERATOR, so it is host-executed in the sense CLAUDE.md
# means: a `run-shell` here would execute on the Mac with no boundary. Nothing in it runs a command,
# and nothing in it should.
#
# It only applies to a server agentdeck STARTS. `start-server` is a no-op against a socket that
# already has a live server - and attaching by hand starts one from your shell - so every setting
# here that has to hold either way is ALSO applied as a global set-option in `Tmux.ensureServer`.
# That duplication is deliberate; src/tmux.ts is the authority for those, this file is the record.

# The scrollback tmux keeps per pane. A cold snapshot captures 2000 lines (HISTORY_LINES in
# src/server.ts), so this is that with room to spare - the deck cannot show more than it captures,
# and a person attached by hand can scroll further.
set-option -g history-limit 10000

# No status bar. It costs a row of a phone-sized pane, and a status-left/right with `#()` in it
# runs a shell command on a timer inside the deck's own server - which is what the operator's
# config was doing.
set-option -g status off

# No mouse mode. Every byte the phone sends reaches a tmux client's parser first, and with mouse
# on tmux claims SGR mouse reports and enters copy-mode on a wheel event. The pane's touch
# scrolling is the client's job (TerminalPane), not tmux's.
set-option -g mouse off

# The prefix is a COMMAND CHANNEL and everything typed on the phone reaches it: with the default
# C-b, `Ctrl b :` is a tmux command prompt and `run-shell` from there is host execution. The
# reasoning and the verification are in src/tmux.ts, which sets these at boot on any server it
# finds. Stated here too so a server started from this file is never briefly bound.
set-option -g prefix none
set-option -g prefix2 none

# What panes see in TERM, and truecolor for the client that is actually rendering them. xterm.js
# handles 24-bit colour, and an agent's diff output is the reason to say so.
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc,*256col*:Tc"
